name: test

on:
  push:
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shell: ['zsh -f', 'bash --norc', 'fish --no-config']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux zsh fish neovim vim lsof
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux neovim fish
      - name: Versions
        run: tmux -V && nvim --version | head -1 && bash --version | head -1
      - name: End-to-end
        env:
          E2E_SHELL: ${{ matrix.shell }}
        run: |
          # Bounded, traced run: on failure show where it was.
          set +e
          perl -e 'alarm shift; exec @ARGV' 300 bash -x tests/e2e.sh 2>trace.log
          status=$?
          [ "$status" -eq 0 ] || tail -n 80 trace.log
          exit "$status"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash -e SC1091,SC2016 hibernate.tmux scripts/*.sh tests/e2e.sh
